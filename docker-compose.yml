version: "3.9"
services:
  api:
    build: .
    container_name: pyconci_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
  db:
    image: postgres:16
    container_name: pyconci_db
    environment:
      POSTGRES_USER: pycon_admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: pyconci
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
volumes:
  pgdata:
